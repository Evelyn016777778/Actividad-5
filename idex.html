<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caja</title>
    <!-- Importación de tipografías desde Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Variables de color basadas en la imagen de Figma */
        :root {
            --bg-color: #FFFFFF;
            --text-main: #111111;
            --text-muted: #666666;
            --accent-green: #596c31; /* Botón verde oliva */
            
            /* Colores del Modelo de Caja (Estilo Terroso/Editorial) */
            --box-margin: #f4f4f0; /* Beige muy claro */
            --box-border: #dcdcd6; /* Gris arena */
            --box-padding: #e9ece4; /* Verde salvia claro */
            --box-content: #ffffff; /* Blanco puro */
            --highlight: #596c31;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- BARRA DE NAVEGACIÓN (Estilo Figma) --- */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1200px;
            padding: 20px 40px;
            box-sizing: border-box;
            margin-top: 10px;
        }
        .nav-logo {
            font-weight: 600;
            font-size: 18px;
            letter-spacing: -0.5px;
        }
        .nav-links {
            display: flex;
            gap: 30px;
        }
        .nav-links a {
            text-decoration: none;
            color: var(--text-main);
            font-size: 13px;
            font-weight: 500;
        }
        .nav-button {
            background-color: var(--accent-green);
            color: white;
            padding: 10px 24px;
            border-radius: 50px; /* Botón píldora */
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
        }

        /* --- SECCIÓN PRINCIPAL HERO --- */
        .hero-section {
            width: 100%;
            max-width: 1200px;
            text-align: center;
            margin-top: 60px;
            margin-bottom: 40px;
        }
        .hero-title {
            font-family: 'Playfair Display', serif;
            font-size: 85px;
            font-weight: 400;
            letter-spacing: -2px;
            margin: 0;
            color: var(--text-main);
        }

        /* --- CONTENEDOR DEL MODELO DE CAJA INTERACTIVO --- */
        .interactive-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 800px;
            gap: 30px;
            margin-bottom: 80px;
        }

        /* Capas del modelo de caja */
        .layer {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border-radius: 16px; /* Bordes suaves modernos */
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
        }
        
        .layer:hover {
            transform: scale(1.01);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }

        .layer.active {
            outline: 2px solid var(--highlight);
            outline-offset: 2px;
            z-index: 10;
        }
        .layer-label {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        /* 1. Margen */
        .margin {
            background-color: var(--box-margin);
            padding: 50px;
            width: 100%;
            box-sizing: border-box;
        }
        /* 2. Borde */
        .border {
            background-color: transparent;
            border: 4px solid var(--box-border);
            padding: 40px;
            width: 100%;
            box-sizing: border-box;
        }
        /* 3. Padding */
        .padding {
            background-color: var(--box-padding);
            padding: 40px;
            width: 100%;
            box-sizing: border-box;
        }
        /* 4. Contenido */
        .content {
            background-color: var(--box-content);
            padding: 40px 60px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #eaeaea;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
        }
        .content-title {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            margin: 0;
            color: var(--accent-green);
        }

        /* --- PANEL DE INFORMACIÓN INFERIOR --- */
        .info-panel {
            background-color: #ffffff;
            border: 1px solid #eaeaea;
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            box-sizing: border-box;
            min-height: 140px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.04);
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .info-panel h2 {
            margin: 0 0 8px 0;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
        }
        .info-panel p {
            margin: 0;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
        }
        .default-text { 
            text-align: center; 
            font-style: italic; 
            color: #a0a0a0 !important;
        }
    </style>
</head>
<body>

   
    

    <!-- SECCIÓN HERO -->
    <header class="hero-section">
        <h1 class="hero-title">Modelo de caja interactivo.</h1>
    </header>

    <!-- DIAGRAMA INTERACTIVO -->
    <main class="interactive-container">
        
        <!-- Margen (Beige) -->
        <div class="layer margin" id="layer-margin" onclick="mostrarInfo('margin', event)">
            <span class="layer-label">Margin</span>
            
            <!-- Borde (Gris Arena) -->
            <div class="layer border" id="layer-border" onclick="mostrarInfo('border', event)">
                <span class="layer-label">Border</span>
                
                <!-- Padding (Verde Salvia) -->
                <div class="layer padding" id="layer-padding" onclick="mostrarInfo('padding', event)">
                    <span class="layer-label">Padding</span>
                    
                    <!-- Contenido (Blanco) -->
                    <div class="layer content" id="layer-content" onclick="mostrarInfo('content', event)">
                        <h2 class="content-title">Core Content</h2>
                        <p style="margin-top: 10px; color: #666; font-size: 14px;">El núcleo de la caja web.</p>
                    </div>
                    
                </div>
            </div>
        </div>

        <!-- PANEL DE INFORMACIÓN DINÁMICO -->
        <div class="info-panel" id="info-panel">
            <p class="default-text">Haz clic en alguna de las capas superiores para descubrir su función estructural.</p>
        </div>

    </main>

    <!-- LÓGICA JAVASCRIPT -->
    <script>
        const datosCaja = {
            margin: {
                titulo: "Margen (Margin) — El espacio exterior",
                texto: "Es el área invisible que rodea el borde. Su función principal es empujar y separar esta caja de los demás elementos de la página, creando una estructura limpia y respirable en el diseño (Whitespace)."
            },
            border: {
                titulo: "Borde (Border) — La delimitación",
                texto: "Es la línea estructural que envuelve el relleno y el contenido. En el diseño moderno suele ser sutil o transparente, pero es fundamental porque marca el límite físico exacto del elemento en el DOM."
            },
            padding: {
                titulo: "Relleno (Padding) — El espacio interior",
                texto: "Es el margen interno entre el borde y el contenido real. Es vital en UI/UX para evitar que el texto o las imágenes choquen contra los bordes, otorgando legibilidad y estética profesional a botones y tarjetas."
            },
            content: {
                titulo: "Contenido (Content) — El núcleo de datos",
                texto: "Es el corazón de la caja. Aquí es donde se renderizan los textos, imágenes, videos o títulos. Las propiedades de ancho (width) y alto (height) en CSS tradicional se aplican directamente a esta zona."
            }
        };

        const infoPanel = document.getElementById('info-panel');
        const todasLasCapas = document.querySelectorAll('.layer');

        function mostrarInfo(capa, event) {
            // Evita el Event Bubbling (que el clic traspase a las cajas de abajo)
            event.stopPropagation();

            // Limpiar la clase activa de todas
            todasLasCapas.forEach(el => el.classList.remove('active'));

            // Resaltar la seleccionada
            document.getElementById(`layer-${capa}`).classList.add('active');

            // Extraer info e inyectar al panel
            const info = datosCaja[capa];
            infoPanel.innerHTML = `
                <h2>${info.titulo}</h2>
                <p>${info.texto}</p>
            `;
            
            // Pequeña animación visual al cambiar el texto
            infoPanel.style.transform = 'translateY(5px)';
            infoPanel.style.opacity = '0.5';
            setTimeout(() => {
                infoPanel.style.transform = 'translateY(0)';
                infoPanel.style.opacity = '1';
            }, 150);
        }
    </script>
</body>
</html>
